<script>

const prices = {
  "سایبان عشق": 500000,
  "اخلاق نیکو": 500000,
  "کتاب سوم": 500000,
  "کتاب چهارم": 500000,
  "مجموعه چهار کتاب": 1800000
};

function formatPrice(number){
  return number.toLocaleString('fa-IR') + " تومان";
}

function updateAmount(){

  const book = document.getElementById("bookSelect").value;
  const price = prices[book];

  document.getElementById("amount").innerText =
    formatPrice(price);
}

function sendOrder(){

  const book =
    document.getElementById("bookSelect").value;

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const postal =
    document.getElementById("postalCode").value.trim();

  const address =
    document.getElementById("address").value.trim();

  /* بررسی اطلاعات */

  if(firstName === ""){
    alert("لطفاً نام خود را وارد کنید.");
    document.getElementById("firstName").focus();
    return;
  }

  if(lastName === ""){
    alert("لطفاً نام خانوادگی خود را وارد کنید.");
    document.getElementById("lastName").focus();
    return;
  }

  if(phone === ""){
    alert("لطفاً شماره موبایل را وارد کنید.");
    document.getElementById("phone").focus();
    return;
  }

  if(postal === ""){
    alert("لطفاً کد پستی را وارد کنید.");
    document.getElementById("postalCode").focus();
    return;
  }

  if(address === ""){
    alert("لطفاً آدرس کامل را وارد کنید.");
    document.getElementById("address").focus();
    return;
  }

  const price = prices[book];

  const orderNumber =
    "ORD-" + Date.now().toString().slice(-8);

  const fullName =
    firstName + " " + lastName;

  /* نمایش اطلاعات سفارش */

  document.getElementById("orderInfo").innerHTML =
    "<br><strong>شماره سفارش:</strong> " + orderNumber +
    "<br><strong>کتاب:</strong> " + book +
    "<br><strong>مبلغ:</strong> " + formatPrice(price) +
    "<br><strong>نام:</strong> " + firstName +
    "<br><strong>نام خانوادگی:</strong> " + lastName +
    "<br><strong>موبایل:</strong> " + phone +
    "<br><strong>کد پستی:</strong> " + postal +
    "<br><strong>آدرس:</strong> " + address;

  /*
    متن پیامک
  */

  const message =
    "سلام، رسید سفارش کتاب\n\n" +
    "شماره سفارش: " + orderNumber + "\n" +
    "کتاب: " + book + "\n" +
    "مبلغ: " + formatPrice(price) + "\n" +
    "نام: " + firstName + "\n" +
    "نام خانوادگی: " + lastName + "\n" +
    "موبایل: " + phone + "\n" +
    "کد پستی: " + postal + "\n" +
    "آدرس: " + address + "\n\n" +
    "شماره پیگیری / کد رسید پرداخت: ";

  /*
    شماره فروشنده
  */

  const sellerPhone = "09915164280";

  /*
    ساخت لینک پیامک
  */

  const smsUrl =
    "sms:" +
    sellerPhone +
    "?body=" +
    encodeURIComponent(message);

  const smsLink =
    document.getElementById("smsLink");

  smsLink.href = smsUrl;

  /*
    نمایش قسمت موفقیت
  */

  document.getElementById("successBox").style.display =
    "block";

  /*
    رفتن به قسمت رسید
  */

  document.getElementById("successBox")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
}


/*
  دکمه ارسال پیامک
*/

document.addEventListener("DOMContentLoaded", function(){

  const smsButton =
    document.getElementById("smsLink");

  if(smsButton){

    smsButton.addEventListener("click", function(event){

      /*
        اگر لینک پیامک ساخته نشده باشد
      */

      if(!this.href || !this.href.startsWith("sms:")){

        event.preventDefault();

        alert("ابتدا اطلاعات سفارش را ثبت کنید.");

        return;
      }

    });

  }

});


updateAmount();

</script>
